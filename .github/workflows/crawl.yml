name: Job Crawler

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch:

concurrency:
  group: ats-crawler
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run crawler
        run: python main.py

      - name: Persist seen jobs to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/seen_jobs.csv

          if git diff --cached --quiet; then
            echo "No seen_jobs changes to commit."
          else
            git commit -m "chore: update seen_jobs baseline [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-results
          path: |
            output/new_jobs.csv
            output/new_entry_level_jobs.csv
            output/recent_24h_jobs.csv
            output/all_relevant_jobs.csv
            output/entry_level_jobs.csv
            data/seen_jobs.csv
